<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика | Standoff 2</title>
    <style>
        body {
            background: #0f0c1a;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1529;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #f1c40f;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { color: #f1c40f; margin-bottom: 20px; }
        .stat-box {
            background: #2c2441;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .stat-box span { color: #f1c40f; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #4a3b6b; text-align: left; }
        th { color: #f1c40f; }
        td { color: #bbb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Статистика</h1>
        <div class="stat-box">
            Всего аккаунтов: <span id="total">0</span>
        </div>
        <table id="table">
            <thead>
                <tr>
                    <th>Номер</th>
                    <th>Дата</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function loadStats() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            
            document.getElementById('total').textContent = data.total;
            
            const tbody = document.querySelector('#table tbody');
            tbody.innerHTML = data.sessions.map(s => `
                <tr>
                    <td>${s.phone}</td>
                    <td>${new Date(s.date).toLocaleString('ru-RU')}</td>
                </tr>
            `).join('');
        }
        loadStats();
        setInterval(loadStats, 5000); // Обновление каждые 5 секунд
    </script>
</body>
</html>
